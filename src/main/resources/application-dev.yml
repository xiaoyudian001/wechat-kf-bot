wecom:
  corp-id: your_corp_id
  token: your_callback_token
  aes-key: your_encoding_aes_key
  secret: your_wechat_kf_secret
  kf-account-id: your_open_kfid

ai:
  base-url: https://api.minimaxi.com/v1/chat/completions
  api-key: ${AI_API_KEY:}
  model: MiniMax-M2.7
  minimal-test-mode: false

persistence:
  jdbc:
    enabled: true

redis-cache:
  enabled: true

http:
  client:
    connect-timeout-ms: 15000
    read-timeout-ms: 60000
    proxy:
      enabled: false
      host: 127.0.0.1
      port: 7890

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wechat_kf_bot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

logging:
  level:
    root: INFO
    com.example.wechatbot: DEBUG
