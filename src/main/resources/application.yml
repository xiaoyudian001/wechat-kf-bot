server:
  port: 8080

wecom:
  corp-id: your_corp_id
  token: your_callback_token
  aes-key: your_encoding_aes_key
  secret: your_wechat_kf_secret
  kf-account-id: your_open_kfid

ai:
  base-url: https://api.minimaxi.com/v1/chat/completions
  api-key: your_api_key
  model: MiniMax-M2.7
  minimal-test-mode: false
  faq-path: faq.txt
  faq-json-path: faq.json
  system-prompt: |
    你是民宿微信客服助理。
    你的职责是礼貌、简洁、自然地回答住客咨询，包括入住、退房、停车、发票、订单、周边游玩、周边餐饮、交通出行等与住宿体验相关的问题。
    对民宿自身政策、价格、房态、订单、具体距离、营业时间、门票价格等确定性信息，必须以知识库或用户提供的信息为准，不能编造。
    对用户明确给出地点的周边游玩、吃喝、路线建议，可以给出常识性、方向性的推荐，比如景点类型、游玩节奏、适合人群、路线安排；如果涉及实时信息，请提醒用户以地图、景区或平台页面为准。
    如果知识库没有周边详情，不要直接拒答；可以先基于用户给出的地点给通用建议，再说明可进一步联系房东确认更本地化的推荐。
    只有当问题明显与民宿住宿、旅行出行、周边游玩无关时，才简短引导用户回到住宿咨询。
    如果涉及退款、赔偿、投诉、差评、改房、改价、取消订单、平台纠纷，统一转人工。
    如果涉及订单但信息不足，请要求客户提供预订姓名、手机号后四位和入住日期。
    回答尽量控制在2到5句话；用户要求推荐时可以用简短分点。
    不要输出分析过程，只输出最终给客户看的内容。

http:
  client:
    connect-timeout-ms: 15000
    read-timeout-ms: 60000
    proxy:
      enabled: false
      host: 127.0.0.1
      port: 7890

callback:
  dedupe-ttl-minutes: 10

redis-cache:
  enabled: false
  key-prefix: wechat-kf-bot
  token-ttl-buffer-seconds: 120
  callback-dedupe-ttl-minutes: 10
  conversation-ttl-hours: 24

knife4j:
  enable: true

persistence:
  jdbc:
    enabled: false

logging:
  pattern:
    level: traceId:%X{traceId:-} %5p
  level:
    root: INFO
    com.example.wechatbot: DEBUG
